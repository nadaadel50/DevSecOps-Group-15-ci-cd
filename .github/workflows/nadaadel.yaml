name: Environment Deployment

run-name: Deploy to ${{ inputs.env }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Choose the environment"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - dev
          - prod

jobs:
  prod-job:
    if: ${{ inputs.env == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Say hello from production
        run: echo "Hello from PROD"

      - name: Display workflow file
        run: cat .github/workflows/nadaadel.yaml

  dev-job:
    if: ${{ inputs.env == 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say hello from development
        run: echo "Hello from DEV"

      - name: Display workflow file
        run: cat .github/workflows/nadaadel.yaml

  qa-job:
    if: ${{ inputs.env == 'qa' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say hello from QA
        run: echo "Hello from QA"

      - name: Display workflow file
        run: cat .github/workflows/nadaadel.yaml